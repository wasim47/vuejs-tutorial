<!DOCTYPE html>
<html>
    <head>
        <script src="https://cdn.jsdelivr.net/npm/vue"></script>
    </head>
        <body>
            <div id="app">
                <table border="1">
                    <tr>
                        <th>Name</th>
                        <th>Mobile</th>
                        <th>Email</th>
                    </tr>
                    <tr>
                        <td>{{ name }}</td>
                        <td>{{ mobile }}</td>
                        <td>{{ email }}</td>
                    </tr>

                </table>
                <br>
                <input type="text" v-model="name">

                <ul>
                    <li v-for='x in forloop'>
                        {{ x.value }}
                    </li>
                </ul>
                

                <div>{{ testFunc() }}</div>
              </div>
        </body>
        
        <script src="app.js" type="text/javascript"></script>
</html>
<!DOCTYPE html>
